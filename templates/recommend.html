<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Recommender System</title>
    <!-- Latest compiled and minified CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/css/bootstrap.min.css" integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u" crossorigin="anonymous">
</head>
<style>
    .text-white{
    color:white
    }
     .navbar-nav > li > a {
            padding: 12px 20px; /* Adds space inside the links */
            margin-right: 20px; /* Adds space between the list items */
            color: white; /* Text color */
            text-decoration: none; /* Removes underline */
            border-radius: 5px; /* Rounded corners for links */
            font-size: 16px; /* Adjust font size */
        }

        /* Hover effect for navbar items */
        .navbar-nav > li > a:hover {
            background-color: #005f41; /* Darker background on hover */
            color: white; /* Keep text white on hover */
        }

        /* Optional: Add spacing around navbar */
        .navbar {
            margin-bottom: 30px;
        }
</style>
<body style="background-color:black">
<nav class="navbar" style="background-color:#00a65a">
    <p class="navbar-brand">
        My Book Recommender
    </p>
    <ul class="navbar-nav">
        <li><a href="/"> Home</a></li>
        <li><a  href="/recommend">Recommend</a></li>
        <li><a>Contact</a></li>
    </ul>
</nav>

<div class="container">
    <div class="row">
        <div class="col-md-12">
            <h1 class="text-white" >Recommended Books</h1>

            <form action="/recommend_books" method="post">
                <input name="user_input" type="text" class="form-control"><br>
                <input type="submit" clas s="btn btn-lg btn-warning" >
            </form>
        </div>
 {% if data %}

        {% for i in data %}

         <div class="col-md-3" style="margin-top:50px;">
     <div class="card">
         <div class="card-body">
         <img class="card-img-top" src="{{i[2]}}">
         <p class="text-white">{{i[0]}}</p>
         <p class="text-white">{{i[1]}}x</p>

             <p class="text-white">4.8</p>
 </div>
     </div>
     </div>
 {% endfor %}
        {% endif %}







    </div>


</div>

</body>
</html>
